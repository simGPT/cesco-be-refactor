name: CD

# main 브랜치에 push 될 때만 실행
on:
  push:
    branches:
      - main

jobs:
  # 1단계: 빌드
  build:
    runs-on: self-hosted  # self-hosted runner에서 실행
    steps:
      # 1. 레포지토리 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. gradlew에 실행 권한 부여
      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      # 4. Gradle로 빌드 (bootJar 생성)
      - name: Build with Gradle
        # 일단 dev 서버 배포, prod는 혹시 추후 운영 예약용
        run: |
          ./gradlew clean bootJar -Pprofile=dev

      # 5. Docker Hub 로그인
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 6. Docker 이미지 빌드 및 Docker Hub로 push
      - name: Docker build & push
        run: |
          docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }} --push .

  # 2단계: 배포
  deploy:
    runs-on: self-hosted
    needs: build  # build job이 끝난 뒤 실행됨
    steps:
      # 1. 레포지토리 재체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. .env 파일 생성
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_DEV }}" > .env

      # 3. 배포 디렉토리 설정
      - name: Setup deployment directory
        run: |
          echo "Current user: $(whoami)"
          echo "Home directory: $HOME"
          mkdir -p $HOME/cesco-be-refactor
          cp docker-compose.yml $HOME/cesco-be-refactor/
          cp .env $HOME/cesco-be-refactor/

      # 4. Docker 배포 실행
      - name: Deploy with Docker
        run: |
          cd $HOME/cesco-be-refactor
          docker compose down
          docker compose pull
          docker compose up -d