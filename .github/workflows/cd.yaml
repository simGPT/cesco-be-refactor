name: CD

# main 브랜치에 push 될 때만 실행
on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 실행 가능

jobs:
  # 1단계: 빌드
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. 레포지토리 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. gradlew에 실행 권한 부여
      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      # 4. Gradle로 빌드 (bootJar 생성)
      - name: Build with Gradle
        # 일단 dev 서버 배포, prod는 혹시 추후 운영 예약용
        run: ./gradlew clean bootJar -Pprofile=dev

      # 5. Docker Hub 로그인
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 6. Docker 이미지 빌드 및 Docker Hub로 push
      - name: Docker build & push
        run: docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }} --push .

  # 2단계: 배포
  deploy:
    runs-on: ubuntu-22.04
    needs: build  # build job이 끝난 뒤 실행됨
    steps:
      # 1. 레포지토리 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. .env 파일 생성
      - name: Create .env file
        run: echo "${{ secrets.ENV_DEV }}" > .env

      # 3. docker-compose.yml, .env 파일을 서버로 전송
      - name: Copy files to server
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > key.pem
          chmod 600 key.pem
          mkdir -p ~/.ssh
          ssh-keyscan ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          ssh -i key.pem ubuntu@${{ secrets.SERVER_HOST }} "mkdir -p ~/cesco-be-refactor"
          scp -i key.pem docker-compose.yml .env ubuntu@${{ secrets.SERVER_HOST }}:~/cesco-be-refactor/

      # 4. SSH로 서버 접속 후 Docker 배포 실행
      - name: Deploy via SSH
        run: ssh -i key.pem ubuntu@${{ secrets.SERVER_HOST }} "cd ~/cesco-be-refactor && docker compose down && docker compose pull && docker compose up -d"